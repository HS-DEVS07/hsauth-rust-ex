[package]
name = "hsauth"
version = "1.0.0"
edition = "2021"
description = "Official HS DEVS AUTH Rust Client SDK"
authors = ["HS DEVS <devs@hsdevs.pro>"]
license = "MIT"

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
